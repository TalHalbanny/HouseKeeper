<!DOCTYPE html>
<html lang="he" dir="ltr"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>HouseKeeper | Add Task</title>
</head>
<body class="bg-gray-50"> 

    <nav class="fixed top-0 left-0 right-0 z-50 flex justify-center px-4 pt-3">
        <div class="w-full max-w-7xl bg-white shadow-lg shadow-blue-900/5 border border-gray-100 rounded-b-3xl px-6 py-2">
            <div class="flex justify-between items-center">
                
                <div class="flex items-center">
                    <img src="assets/logo.png" alt="HouseKeeper Logo" class="h-10 w-auto object-contain drop-shadow-md">
                </div>

                <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-500">
                    <a href="/dashboard" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Dashboard</a>
                    <a href="#" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Documents</a>
                    <a href="/add_task" class="text-green-600 border-b-2 border-green-600 pb-1">Add Task</a>
                    <a href="#" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Add to House</a>
                    <a href="#" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Event Calendar</a>
                    <a href="#" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Shopping Lists</a>   
                </div>

                <div class="flex items-center gap-2 md:gap-4">
                    <button class="p-2 text-slate-400 hover:text-blue-600 transition-colors relative">
                        <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                    </button>
                    
                    <div class="h-8 w-[1px] bg-gray-100 mx-1 hidden sm:block"></div>

                    <div id="display_name" class="text-[11px] font-bold text-slate-800 hidden sm:block"></div>

                    <button id="mobile-menu-button" class="md:hidden p-2 text-slate-600">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-12 px-4 flex justify-center">
    <div class="w-full max-w-lg">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Add New Task</h1>
            <p class="text-slate-500 mt-2 font-medium">Manage or Add Houshold Tasks</p>
        </div>

        <div class="bg-white shadow-xl shadow-blue-900/5 border border-gray-100 rounded-[2rem] p-8 md:p-10">
            <form id="task_form" class="space-y-6">
                
                <div>
                    <label for="task_headline" class="block text-sm font-semibold text-slate-700 mb-2 mr-1">Task Headline</label>
                    <input type="text" id="task_headline" name="task_headline" required
                        placeholder="Example: Fix the Drain..."
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 outline-none transition-all text-slate-600 placeholder:text-slate-300">
                </div>

                <div>
                    <label for="task_body" class="block text-sm font-semibold text-slate-700 mb-2 mr-1">Task Description</label>
                    <textarea id="task_body" name="task_body" rows="3"
                        placeholder="What Need to be done?"
                        class="w-full px-4 py-3 rounded-2xl border border-gray-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 outline-none transition-all text-slate-600 placeholder:text-slate-300 resize-none"></textarea>
                </div>

                <div>
                    <label for="task_urgency" class="block text-sm font-semibold text-slate-700 mb-2 mr-1">Task Urgency</label>
                    <div class="relative">
                        <select id="task_urgency" name="task_urgency" required
                            class="w-full appearance-none px-4 py-3 rounded-2xl border border-gray-200 focus:border-green-500 focus:ring-4 focus:ring-green-500/10 outline-none transition-all text-slate-600 bg-white">
                            <option value="" disabled selected>Choose Task </option>
                            <option value="low">On Free Time</option>
                            <option value="medium">Important</option>
                            <option value="high">Must be Done Soon</option>
                        </select>

                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-4 text-slate-400">
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" 
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-green-600/20 hover:shadow-green-600/30 transition-all active:scale-[0.98]">
                        Add Task
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-6">
            <a href="/Dashboard" class="text-sm font-semibold text-slate-400 hover:text-blue-600 transition-colors">
                &larr; Return to Dashboard
            </a>
        </div>
    </div>
</main>

    <script>
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');
        if(btn) {
            btn.addEventListener('click', () => menu.classList.toggle('hidden'));
        }
    </script>
    <script src="/js/dashboard.js"></script> 
    <script src="/js/add_task.js"></script>
</body>
</html>
