<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>HouseKeeper | Login</title>
</head>
<body>
<form method="POST" id="login_form">
<section class="text-gray-600 body-font">
  <div class="container px-5 py-24 mx-auto flex flex-wrap items-center">
    <div class="lg:w-3/5 md:w-1/2 md:pr-16 lg:pr-0 pr-0">
      
      <img src="assets/HKIMG1.png" alt="HouseKeeper Logo" class="w-200 h-200 mb-6">
      
      <h1 class="title-font font-medium text-3xl text-green-500">Welcome to HouseKeeper, House Managment at your reach!</h1>
      <p class="leading-relaxed mt-4"> Manage Documents and Important Data, HouseKeeper is the Safe place for Data and Managment of your Household tasks!</p>
    </div>
    
    <div class="lg:w-2/6 md:w-1/2 bg-gray-100 rounded-lg p-8 flex flex-col md:ml-auto w-full mt-10 md:mt-0">
      <h2 class="text-gray-900 text-lg font-medium title-font mb-5">Log In</h2>
      <div class="relative mb-4">
        <label for="mailtext" class="leading-7 text-sm text-gray-600">Email</label>
        <input type="email" id="InputMail" name="validateEmail" class="w-full bg-white rounded border border-gray-300 focus:border-green-500 focus:ring-2 focus:ring-green-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
      </div>
      <div class="relative mb-4">
        <label for="code" class="leading-7 text-sm text-gray-600">Household PIN</label>
        <input type="password" id="InputPIN" name="householdPIN" class="w-full bg-white rounded border border-gray-300 focus:border-green-500 focus:ring-2 focus:ring-green-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
      </div>
      <button type="submit" class="text-white bg-green-500 border-0 py-2 px-8 focus:outline-none hover:bg-green-600 rounded text-lg">Enter your House</button>
      <div class="mt-4 flex flex-col items-center space-y-2">
      <p class="text-sm text-gray-600">
       New Here? 
      <a href="/register" class="text-green-500 font-bold hover:underline">Sign up!</a>
      </p>

      <a href="#" class="text-xs text-green-500 hover:text-green-600 transition-colors">
      I Forgot my Password
      </a>

      </div>
    </div>
  </div>
</section>
</form>
<script src="/js/validate_user.js"></script>
</body>
</html>
