<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <title>HouseKeepr | Add To House</title>
</head>
<body>

    <nav class="fixed top-0 left-0 right-0 z-50 flex justify-center px-4 pt-3">
        <div class="w-full max-w-7xl bg-white shadow-lg shadow-blue-900/5 border border-gray-100 rounded-b-3xl px-6 py-2">
            <div class="flex justify-between items-center">
                
                <div class="flex items-center">
                    <img src="assets/logo.png" alt="HouseKeeper Logo" class="h-10 w-auto object-contain drop-shadow-md">
                </div>

                <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-500">
                    <a href="/dashboard" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Dashboard</a>
                    <a href="#" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Documents</a>
                    <a href="/add_task" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Add Task</a>
                    <a href="/add_to_house" class="text-green-600 border-b-2 border-green-600 pb-1">Add to House</a>
                    <a href="#" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Event Calendar</a>
                    <a href="#" class="hover:text-green-600 transition-all border-b-2 border-transparent hover:border-green-600 pb-1">Shopping Lists</a>   
                </div>

                <div class="flex items-center gap-2 md:gap-4">
                    <button class="p-2 text-slate-400 hover:text-blue-600 transition-colors relative">
                        <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                    </button>
                    
                    <div class="h-8 w-[1px] bg-gray-100 mx-1 hidden sm:block"></div>

                    <div id="display_name" class="text-[11px] font-bold text-slate-800 hidden sm:block"></div>

                    <button id="mobile-menu-button" class="md:hidden p-2 text-slate-600">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                        </svg>
                    </button>
                </div>
            </div>

            <div id="mobile-menu" class="hidden md:hidden mt-4 pb-4 border-t border-gray-100 flex flex-col gap-4 text-center text-slate-600 font-medium">
            <a href="/dashboard" class="pt-4 hover:text-green-600">Dashboard</a>
            <a href="#" class="hover:text-green-600">Documents</a>
            <a href="/add_task" class="hover:text-green-600">Add Task</a>
            <a href="/add_to_house" class="text-green-600 font-bold">Add to House</a>
            <a href="#" class="hover:text-green-600">Event Calendar</a>
            <a href="#" class="hover:text-green-600">Shopping Lists</a>
            <div>

        </div>
    </nav>

    </br>
    </br>
    </br>
   

    <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl shadow-blue-900/5 border border-gray-100 p-8">
        
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800">Register New Vehicle</h2>
            <p class="text-slate-500 text-sm mt-2">Enter the details of the car to add it to the house</p>
        </div>


        <form id="carRegistrationForm" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Car Maker</label>
                    <input type="text" placeholder="e.g. Tesla" 
                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-100 focus:border-green-500 focus:bg-white focus:ring-2 focus:ring-green-200 outline-none transition-all text-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Car Model</label>
                    <input type="text" placeholder="e.g. Model 3" 
                        class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-100 focus:border-green-500 focus:bg-white focus:ring-2 focus:ring-green-200 outline-none transition-all text-slate-700">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Car Year</label>
                <input type="number" min="1900" max="2026" placeholder="2024" 
                    class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-100 focus:border-green-500 focus:bg-white focus:ring-2 focus:ring-green-200 outline-none transition-all text-slate-700">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Annual Car Test Date</label>
                <input type="date" 
                    class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-100 focus:border-green-500 focus:bg-white focus:ring-2 focus:ring-green-200 outline-none transition-all text-slate-700">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Vehicle Status</label>
                <div class="flex gap-4">
                    <label class="flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition-all has-[:checked]:border-green-500 has-[:checked]:bg-green-50 has-[:checked]:text-green-700">
                        <input type="radio" name="status" value="true" class="w-4 h-4 text-green-600 focus:ring-green-500" checked>
                        <span class="text-sm font-semibold">Active</span>
                    </label>
                    <label class="flex-1 flex items-center justify-center gap-2 p-3 rounded-xl border border-gray-100 bg-gray-50 cursor-pointer hover:bg-gray-100 transition-all has-[:checked]:border-red-500 has-[:checked]:bg-red-50 has-[:checked]:text-red-700">
                        <input type="radio" name="status" value="false" class="w-4 h-4 text-red-600 focus:ring-red-500">
                        <span class="text-sm font-semibold">Not Active</span>
                    </label>
                </div>
            </div>

            <button type="submit" 
                class="w-full py-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-2xl shadow-lg shadow-green-900/20 transform transition-all active:scale-[0.98] mt-4">
                Register Vehicle
            </button>
        </form>
    </div>
</div>

</body>
<script src="/js/dashboard.js"></script> 
<script src="/js/add_car.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const btn = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');

        if (btn && menu) {
            btn.addEventListener('click', () => {
                menu.classList.toggle('hidden');
            });
        }
    });
</script>
</html>
