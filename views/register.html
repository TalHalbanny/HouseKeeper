<!DOCTYPE html>
<html lang="en" dir="ltr"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Register | HouseKeeper</title>
    <style>
        body {
            background-image: url('assets/regstrbg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-900/50 backdrop-blur-sm">

<div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 transform transition-all hover:scale-[1.01]">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">Create HouseKeeper Account</h1>
            <p class="text-gray-500 mt-2">Manage your home efficiently</p>
        </div>

        <form method="POST" action="#" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">Household Name</label>
                <input type="text" id="name" placeholder="Smith Residents.." 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all placeholder:text-gray-300">
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all placeholder:text-gray-300">
            </div>

            
            <div> 
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition-all">
            </div>

            <button type="submit" 
                class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-green-200 transition-all active:scale-95">
                Register & Get PIN Code
            </button>
        </form>

        <div class="mt-8 text-center space-y-3">
            <p class="text-sm text-gray-600">
                Already have an account? 
                <a href="/" class="text-green-600 font-bold hover:underline">Sign in here</a>
            </p>
            <a href="#" class="block text-xs text-gray-400 hover:text-gray-600 transition-colors">
                Terms of Service & Privacy Policy
            </a>
        </div>
</div>

<div id="pinModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-2xl text-center transform transition-all">
        <div class="mb-4 text-green-500">
            <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Registration Successful!</h2>
        <p class="text-gray-600 mb-6">Save your Household PIN code:</p>
        
        <div class="bg-gray-100 rounded-lg py-4 mb-6">
            <span id="displayPin" class="text-4xl font-mono font-extrabold tracking-widest text-green-600">0000</span>
        </div>

        <button onclick="window.location.href='/'" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl transition-colors">
            Got it, take me to Login
        </button>
    </div>
</div>

    <script src="/js/register.js"></script>
</body>
</html>
