<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/app.css">
    <title>Register | HouseKeeper</title>
</head>
<body class="auth-page auth-register min-h-screen flex items-center justify-center px-4">

<div class="auth-card w-full max-w-md rounded-[2rem] shadow-2xl p-8">
        <div class="text-center mb-10">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">Create HouseKeeper Account</h1>
            <p class="text-slate-400 mt-2">Manage your home efficiently</p>
        </div>

        <form method="POST" action="#" class="space-y-6">
            <div>
                <label for="name" class="form-label">Household Name</label>
                <input type="text" id="name" placeholder="Smith Residents.." class="form-input">
            </div>
            <div>
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" class="form-input">
            </div>
            <div>
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="form-input">
            </div>
            <button type="submit" class="btn-primary">Register & Get PIN Code</button>
        </form>

        <div class="mt-8 text-center space-y-3">
            <p class="text-sm text-slate-500">
                Already have an account?
                <a href="/" class="text-[#2FA084] font-bold hover:underline">Sign in here</a>
            </p>
            <a href="#" class="block text-xs text-slate-400 hover:text-slate-600 transition-colors">Terms of Service & Privacy Policy</a>
        </div>
</div>

<div id="pinModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center z-50">
    <div class="auth-card rounded-[2rem] p-8 max-w-sm w-full mx-4 text-center">
        <div class="mb-4 text-[#2FA084]">
            <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Registration Successful!</h2>
        <p class="text-slate-500 mb-6">Save your Household PIN code:</p>
        <div class="bg-slate-50 rounded-xl py-4 mb-6 border border-slate-100">
            <span id="displayPin" class="text-4xl font-mono font-extrabold tracking-widest text-[#2FA084]">0000</span>
        </div>
        <button onclick="window.location.href='/'" class="btn-primary">Got it, take me to Login</button>
    </div>
</div>

<script src="/js/register.js"></script>
</body>
</html>
